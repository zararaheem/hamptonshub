<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Odyssey Games — Live Scoreboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0e1526; --panel:#152036;
    --ink:#eef2f8; --ink-soft:#b7c2d4; --muted:#7c8aa2; --hair:#243349;
    --athena:#6C8CD5; --apollo:#E6A817; --artemis:#2FA98C; --hephaestus:#E4572E;
    --display:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);color:var(--ink);background:radial-gradient(1200px 700px at 50% -10%, #1b2942, var(--paper));min-height:100vh;position:relative;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;font-feature-settings:"liga" 1,"kern" 1}
  .wrap{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:44px 26px 60px}
  header{text-align:center;margin-bottom:36px}
  .clock{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);margin-top:14px}
  h1{font-family:var(--display);font-weight:300;font-size:clamp(38px,6.6vw,72px);line-height:1.02;margin:8px 0 6px;color:var(--ink);letter-spacing:.005em}
  h1 em{font-style:italic;font-weight:400}
  .rule{width:54px;height:1px;background:var(--ink);opacity:.35;margin:16px auto 0}
  .tag{font-size:13.5px;color:var(--muted);margin-top:14px;letter-spacing:.02em}
  .live-dot{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .live-dot i{width:7px;height:7px;border-radius:50%;background:#7fa38f;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,163,143,.45)}70%{box-shadow:0 0 0 9px rgba(127,163,143,0)}100%{box-shadow:0 0 0 0 rgba(127,163,143,0)}}

  .meander{width:min(420px,70%);height:16px;margin:18px auto 0;color:#c9a24a;opacity:.6}
  .meander svg{width:100%;height:100%;display:block}
  /* Leaderboard — rows sorted by score; the leader animates to the top */
  .board{position:relative;max-width:940px;margin:26px auto 0;height:432px}
  .lb-row{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:20px;padding:0 26px;
    background:linear-gradient(90deg, color-mix(in srgb,var(--tc) 20%, var(--panel)), var(--panel) 72%);
    border:1px solid color-mix(in srgb,var(--tc) 34%, var(--hair));border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.30);
    transition:top .8s cubic-bezier(.2,.85,.25,1), box-shadow .6s, border-color .6s}
  .lb-row.leader{border-color:color-mix(in srgb,var(--tc) 72%,var(--hair));box-shadow:0 18px 52px color-mix(in srgb,var(--tc) 42%,transparent)}
  .lb-rank{font-family:var(--display);font-weight:300;font-size:34px;color:var(--tc);width:40px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
  .lb-emblem{width:56px;height:56px;color:var(--tc);flex:none}
  .lb-emblem svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 8px color-mix(in srgb,var(--tc) 30%,transparent))}
  .lb-main{flex:1;min-width:0}
  .lb-name{font-family:var(--display);font-weight:400;font-size:25px;color:var(--ink);line-height:1;margin-bottom:11px}
  .lb-track{height:14px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
  .lb-fill{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 55%,transparent),var(--tc));border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .lb-score{font-family:var(--display);font-weight:300;font-size:clamp(40px,5vw,56px);color:var(--tc);width:96px;text-align:right;flex:none;font-variant-numeric:tabular-nums;line-height:1}
  .lb-score.bump{animation:bump .6s cubic-bezier(.2,1.35,.4,1)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
  @media(max-width:560px){ .board{height:376px} .lb-row{height:84px;gap:12px;padding:0 16px} .lb-emblem{width:44px;height:44px} .lb-name{font-size:21px} .lb-score{font-size:38px;width:70px} }
  /* team rosters — compact, below the leaderboard */
  .lb-rosters{max-width:940px;margin:34px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  @media(max-width:760px){ .lb-rosters{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:440px){ .lb-rosters{grid-template-columns:1fr} }
  .lb-rcol{border-top:2px solid var(--tc);padding-top:10px}
  .lb-rcap{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tc);display:flex;justify-content:space-between;margin-bottom:8px}
  .lb-rnames{font-size:12px;color:var(--ink-soft);line-height:1.65}

  .feed{margin-top:46px;max-width:820px;margin-left:auto;margin-right:auto}
  .feed h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;text-align:center}
  .feed h2 span{display:block;width:38px;height:1px;background:var(--hair);margin:12px auto 0}
  .rows{display:flex;flex-direction:column}
  .row{display:grid;grid-template-columns:56px minmax(120px,168px) 1fr auto;align-items:center;gap:16px;
    padding:13px 6px;border-bottom:1px solid var(--hair);font-size:14.5px;animation:fade .5s ease}
  .row:last-child{border-bottom:0}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .rpts{font-family:var(--display);font-weight:400;font-size:19px;color:var(--tc);text-align:center;font-variant-numeric:tabular-nums}
  .rteam{font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
  .rteam .dot{width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none}
  .rreason{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rmeta{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
  @media(max-width:600px){ .row{grid-template-columns:46px 1fr auto;gap:10px} .rreason{display:none} }
  .empty{text-align:center;color:var(--muted);padding:22px;font-family:var(--display);font-style:italic;font-size:16px}
  .foot{text-align:center;margin-top:34px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5b6880}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="clock" id="clock">—</div>
      <div class="eyebrow">Alpha Summer · Trojan Horse × Olympics</div>
      <h1>The <em>Odyssey</em> Games</h1>
      <div class="rule"></div>
      <div class="tag">East Hampton · Week 9 · Athena · Apollo · Artemis · Hephaestus</div>
      <div class="live-dot"><i></i> Live · updates every 5 seconds</div>
      <div class="meander" aria-hidden="true"><svg viewBox="0 0 200 16" preserveAspectRatio="xMidYMid meet"><defs><pattern id="gk" width="20" height="16" patternUnits="userSpaceOnUse"><path d="M2 14 V4 H14 V12 H8 V8" fill="none" stroke="currentColor" stroke-width="1.4"/></pattern></defs><rect width="200" height="16" fill="url(#gk)"/></svg></div>
    </header>

    <div class="board" id="board"></div>
    <div class="lb-rosters" id="rosters"></div>

    <div class="feed">
      <h2>Latest Points Awarded<span></span></h2>
      <div class="rows" id="rows"><div class="empty">Awaiting the first points…</div></div>
    </div>

    <div class="foot" id="foot">connecting…</div>
  </div>

<script>
  const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3bWV0ZmZ6c3BvYmphbXd3aGNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMDU1MTcsImV4cCI6MjA5NzY4MTUxN30.ES56s2HLTm1hxvYZL6arlPsGnYlaiLcBvj5buRaWyHs';
  // Reads a public, read-only view (safe columns only, week 9) — no login, no emails exposed.
  const REST='https://qwmetffzspobjamwwhca.supabase.co/rest/v1/odyssey_board?select=tribe,points,reason,created_at&order=created_at.desc';
  const REST_ROSTER='https://qwmetffzspobjamwwhca.supabase.co/rest/v1/odyssey_roster?select=og_team,name&order=name';
  let ROSTER=null;
  const ORDER=['athena','apollo','artemis','hephaestus'];
  const COLOR={ athena:'var(--athena)', apollo:'var(--apollo)', artemis:'var(--artemis)', hephaestus:'var(--hephaestus)' };
  const EMBLEMS={
    athena:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="30"/><circle cx="32" cy="32" r="26.5" stroke-width="1" stroke-dasharray="0.4 3.4"/><path d="M32 20c-6.6 0-10.2 5-10.2 11.6 0 6.6 4.3 11.2 10.2 11.2s10.2-4.6 10.2-11.2C42.2 25 38.6 20 32 20Z"/><path d="M24 22.5 27.4 26.8M40 22.5 36.6 26.8"/><circle cx="27.7" cy="30.2" r="3.3"/><circle cx="36.3" cy="30.2" r="3.3"/><circle cx="27.7" cy="30.2" r="1" fill="currentColor" stroke="none"/><circle cx="36.3" cy="30.2" r="1" fill="currentColor" stroke="none"/><path d="M32 33.2 30.3 35.6 32 36.9 33.7 35.6Z"/><path d="M25.5 38.4c2.1 1.9 3.9 2.6 6.5 2.6s4.4-.7 6.5-2.6"/><path d="M20 44.5c2.4-1.3 4.4-1.2 6 .2M22.8 43.2c-.5-1.3-.2-2.4.8-3.3M24.8 45.1c.2-1.3 1-2.1 2.2-2.5"/></svg>`,
    apollo:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="30"/><circle cx="32" cy="32" r="26.5" stroke-width="1" stroke-dasharray="0.4 3.4"/><path d="M26 39c0 6.5 12 6.5 12 0"/><path d="M26.4 38.4c1.5-2 10-2 11.2 0"/><path d="M27 37.5C22 34.5 20.5 27.5 24.2 18.8"/><path d="M37 37.5c5-3 6.5-10 2.8-18.7"/><path d="M24.2 18.8c4.2-2.7 11.4-2.7 15.6 0"/><path d="M29 21V36.5M32 20.3V37M35 21V36.5"/></svg>`,
    artemis:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="30"/><circle cx="32" cy="32" r="26.5" stroke-width="1" stroke-dasharray="0.4 3.4"/><path d="M25 15C36 23 36 41 25 49"/><path d="M25 15V49"/><path d="M17 32H45"/><path d="M45 32 40 28.5M45 32 40 35.5"/><path d="M17 32 21 29M17 32 21 35"/><path d="M43 16c-3.4 1-5.8 4.2-5.8 8 0 3.8 2.4 7 5.8 8-1.2.4-2.5.6-3.8.6-4.7 0-8.6-3.9-8.6-8.6S36.3 15.4 41 15.4c.7 0 1.4.1 2 .3Z" stroke-width="1.2"/></svg>`,
    hephaestus:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="30"/><circle cx="32" cy="32" r="26.5" stroke-width="1" stroke-dasharray="0.4 3.4"/><path d="M18.5 18.5 25.5 25.5" stroke-width="4.4"/><path d="M24 24 40 40" stroke-width="1.8"/><path d="M45.5 19 41 23.5M45.5 24 41 23.5"/><path d="M42.5 22 26 39"/><path d="M39 22.5 24.5 37"/><path d="M27 46c-1.5-2 .5-3.5-.5-5.5 2 1 3 3 2.4 5M32 47c-2-2.4.6-4.6-.6-7.2 2.6 1.4 3.8 4.2 2.8 7M37 46c-1.4-1.9.5-3.4-.5-5.3 1.9 1 2.9 2.9 2.3 4.9"/></svg>`,
  };
  const TEAMS={ athena:{name:'Athena'}, apollo:{name:'Apollo'}, artemis:{name:'Artemis'}, hephaestus:{name:'Hephaestus'} };
  const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const roman=['I','II','III','IV'];
  let last={};

  function clockTick(){ const d=new Date();
    document.getElementById('clock').textContent =
      d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})+'  ·  '+
      d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
  clockTick(); setInterval(clockTick,1000);

  function ordinal(n){ return ['First','Second','Third','Fourth'][n]||(n+1)+'th'; }

  const ROWH=96, GAP=16;
  function render(totals, recent){
    const board=document.getElementById('board');
    const max=Math.max(1,...ORDER.map(k=>totals[k]||0));
    const top=Math.max(...ORDER.map(k=>totals[k]||0));
    const lead = ORDER.filter(k=>(totals[k]||0)===top && top>0).length===1 ? ORDER.find(k=>(totals[k]||0)===top) : '';
    // Sorted high→low; ORDER index breaks ties so positions stay stable.
    const ranked=ORDER.slice().sort((a,b)=>(totals[b]||0)-(totals[a]||0) || ORDER.indexOf(a)-ORDER.indexOf(b));
    if(!board.children.length){
      board.innerHTML=ORDER.map(k=>{ const T=TEAMS[k]||{name:k}; const c=COLOR[k];
        return `<div class="lb-row" id="p-${k}" style="--tc:${c}">
          <div class="lb-rank" id="rk-${k}"></div>
          <div class="lb-emblem">${EMBLEMS[k]||''}</div>
          <div class="lb-main"><div class="lb-name">${esc(T.name)}</div><div class="lb-track"><span class="lb-fill" id="b-${k}" style="width:0%"></span></div></div>
          <div class="lb-score" id="s-${k}">0</div>
        </div>`; }).join('');
    }
    ranked.forEach((k,slot)=>{
      const row=document.getElementById('p-'+k);
      row.style.top=(slot*(ROWH+GAP))+'px';
      row.classList.toggle('leader', lead===k);
      // competition rank — tied teams share a number; blank until someone scores.
      const rnum=1+ORDER.filter(j=>(totals[j]||0)>(totals[k]||0)).length;
      document.getElementById('rk-'+k).textContent = top>0 ? rnum : '';
      const v=totals[k]||0; const s=document.getElementById('s-'+k);
      if(last[k]!==undefined && v!==last[k]){ s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
      s.textContent=v; last[k]=v;
      document.getElementById('b-'+k).style.width=Math.round(v/max*100)+'%';
    });

    const rhost=document.getElementById('rosters');
    if(rhost && ROSTER){
      rhost.innerHTML=ORDER.map(k=>{ const T=TEAMS[k]||{name:k}; const c=COLOR[k]; const names=ROSTER[k]||[];
        return `<div class="lb-rcol" style="--tc:${c}"><div class="lb-rcap"><span>${esc(T.name)}</span><span>${names.length}</span></div><div class="lb-rnames">${names.map(esc).join(' · ')}</div></div>`; }).join('');
    }

    const rows=document.getElementById('rows');
    if(recent && recent.length){
      rows.innerHTML=recent.map(r=>{ const T=TEAMS[r.tribe]||{name:r.tribe}; const c=COLOR[r.tribe]||'var(--muted)';
        const t2=r.created_at?new Date(r.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'';
        const p=Number(r.points);
        return `<div class="row" style="--tc:${c}">
          <span class="rpts">${p>0?'+':''}${p}</span>
          <span class="rteam"><span class="dot"></span>${esc(T.name)}</span>
          <span class="rreason">${esc(r.reason||'—')}</span>
          <span class="rmeta">${t2?esc(t2):''}</span>
        </div>`; }).join('');
    } else rows.innerHTML='<div class="empty">Awaiting the first points…</div>';
  }

  async function loadRoster(){
    try{
      const res=await fetch(REST_ROSTER,{headers:{'apikey':ANON,'Authorization':'Bearer '+ANON}});
      const rows=await res.json();
      if(Array.isArray(rows)){ const g={}; ORDER.forEach(k=>g[k]=[]);
        rows.forEach(r=>{ if(g[r.og_team]) g[r.og_team].push(r.name); }); ROSTER=g; }
    }catch(e){}
  }
  async function tick(){
    try{
      if(!ROSTER) await loadRoster();
      const res=await fetch(REST,{headers:{'apikey':ANON,'Authorization':'Bearer '+ANON}});
      const rows=await res.json();
      if(Array.isArray(rows)){
        const totals={}; ORDER.forEach(k=>totals[k]=0);
        rows.forEach(r=>{ if(totals[r.tribe]!=null) totals[r.tribe]+=(+r.points||0); });
        render(totals, rows.slice(0,14));
        document.getElementById('foot').textContent='Live · updates every 5 seconds';
      }
    }catch(e){ document.getElementById('foot').textContent='Reconnecting…'; }
  }
  tick(); setInterval(tick, 5000);
</script>
</body>
</html>
