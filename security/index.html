<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Front Desk · Alpha Summer</title>
<style>
  :root{--navy:#0e1c2b;--navy-2:#12283d;--panel:#16324b;--line:#22405c;--ink:#eaf1f7;--muted:#9db2c6;--brass:#c8924a;--brass-b:#e0b872;--teal:#5fb3a9;--ok:#57b894;--coral:#e0736b}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#173250,#0c1826 60%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
  .wrap{max-width:820px;margin:0 auto;padding:26px 18px 60px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
  h1{font-size:26px;margin:2px 0 0;font-weight:700}
  .clock{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 20px}
  .bar label{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  input[type=date]{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .stat .n{font-size:34px;font-weight:700;line-height:1}
  .stat .l{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .stat.visitors .n{color:var(--brass-b,#e0b872)}
  .stat.students .n{color:var(--teal)}
  .sec-title{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin:0 2px 10px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{text-align:left;padding:12px 14px;font-size:15px;border-bottom:1px solid var(--line)}
  th{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--navy-2)}
  tr:last-child td{border-bottom:0}
  .time{font-family:ui-monospace,Menlo,monospace;color:var(--brass-b,#e0b872);white-space:nowrap}
  .party{font-family:ui-monospace,Menlo,monospace;text-align:center;white-space:nowrap}
  .purpose{color:var(--muted)}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
  .foot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="eyebrow">Front Desk · Security</div>
        <h1>Alpha Summer — Who's on campus</h1>
      </div>
      <div class="clock"><span class="dot"></span><span id="clock">—</span></div>
    </header>

    <div class="bar">
      <label for="date">Day</label>
      <input type="date" id="date">
      <span id="daylabel" class="clock"></span>
    </div>

    <div class="stats">
      <div class="stat visitors"><div class="n" id="s-parties">—</div><div class="l">Visits / tours scheduled</div></div>
      <div class="stat visitors"><div class="n" id="s-heads">—</div><div class="l">Visitors expected (people)</div></div>
      <div class="stat students"><div class="n" id="s-students">—</div><div class="l" id="s-students-l">Students enrolled</div></div>
    </div>

    <div class="sec-title">Visitors &amp; tours</div>
    <div id="list"></div>

    <div class="foot">Counts only — no student names or details. Visitor schedule is maintained by Admissions.<br>Auto-refreshes every minute.</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL='https://qwmetffzspobjamwwhca.supabase.co';
  const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3bWV0ZmZ6c3BvYmphbXd3aGNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMDU1MTcsImV4cCI6MjA5NzY4MTUxN30.ES56s2HLTm1hxvYZL6arlPsGnYlaiLcBvj5buRaWyHs';
  const sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const $=id=>document.getElementById(id);

  function nyTodayISO(){
    const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const g=t=>p.find(x=>x.type===t).value; return `${g('year')}-${g('month')}-${g('day')}`;
  }
  function tick(){
    $('clock').textContent=new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit'});
  }
  function prettyDay(iso){
    try{ return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); }catch(e){ return iso; }
  }
  // sort visitors by time (blank last)
  function tkey(t){ const m=String(t||'').match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i); if(!m) return 1e9; let h=+m[1]%12; if(/pm/i.test(m[3]||'')) h+=12; return h*60+ +m[2]; }

  async function load(){
    const day=$('date').value||nyTodayISO();
    $('daylabel').textContent=prettyDay(day);
    let payload=null;
    try{ const r=await sb.rpc('security_view',{p_day:day}); payload=r&&r.data; }catch(e){}
    if(!payload||!payload.ok){ $('list').innerHTML='<div class="empty">Couldn’t load right now — refreshing shortly.</div>'; return; }
    $('s-parties').textContent=payload.parties||0;
    $('s-heads').textContent=payload.heads||0;
    $('s-students').textContent=payload.studentsEnrolled||0;
    $('s-students-l').textContent=payload.weekN?`Students enrolled · Week ${payload.weekN}`:'Students enrolled';
    const v=(payload.visitors||[]).slice().sort((a,b)=>tkey(a.time)-tkey(b.time));
    if(!v.length){ $('list').innerHTML='<div class="empty">No visitors or tours scheduled for this day.</div>'; return; }
    $('list').innerHTML=`<table><thead><tr><th>Time</th><th>Visitor / group</th><th>Purpose</th><th style="text-align:center">People</th></tr></thead><tbody>`+
      v.map(x=>`<tr><td class="time">${esc(x.time||'—')}</td><td><b>${esc(x.name||'—')}</b></td><td class="purpose">${esc(x.purpose||'')}</td><td class="party">${x.party||''}</td></tr>`).join('')+
      `</tbody></table>`;
  }

  $('date').value=nyTodayISO();
  $('date').addEventListener('change',load);
  tick(); setInterval(tick,1000);
  load(); setInterval(load,60000);
</script>
</body>
</html>
