<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Showcase Keepsake Card</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#14232f;--navy:#0e2233;--muted:#5d6b78;--brass:#a9772c;--brass-d:#8a5e1f;--teal:#1f7a73;
        --display:'Fraunces',Georgia,serif;--body:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0}
  html,body{background:#e9edf2;display:flex;align-items:center;justify-content:center;min-height:100vh}
  @media print{ html,body{background:#fff} @page{size:2.125in 3.375in;margin:0} }
  .card{width:2.125in;height:3.375in;background:#fff;color:var(--ink);font-family:var(--body);
        display:flex;flex-direction:column;align-items:center;overflow:hidden;box-shadow:0 10px 30px rgba(20,40,60,.18)}
  @media print{ .card{box-shadow:none} }
  .top{padding:.2in .18in .04in;text-align:center;width:100%}
  .marquee{color:var(--brass);letter-spacing:.32em;font-size:9px}
  .eyebrow{color:var(--teal);letter-spacing:.16em;text-transform:uppercase;font-size:7px;font-weight:700;margin-top:6px}
  .title{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.03;margin:5px 2px 4px;color:var(--navy)}
  .laurels{color:var(--brass-d);font-size:7px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.06in .18in}
  .scan{font-family:var(--display);font-weight:600;font-size:14px;color:var(--brass-d);margin-bottom:8px}
  .qrtile{border:1px solid #e6e0d4;border-radius:10px;padding:7px}
  .qr{width:1.2in;height:1.2in;display:block;image-rendering:pixelated}
  .cap{color:var(--muted);font-size:8px;margin-top:9px;text-align:center;line-height:1.45}
  .foot{text-align:center;padding:0 .18in .18in;color:#98a3ad;font-size:6.5px;letter-spacing:.06em;text-transform:uppercase}
  .hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#5d6b78;font-family:var(--body);font-size:12px}
  @media print{ .hint{display:none} }
</style>
</head>
