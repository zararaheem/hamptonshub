<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Odyssey Games — Live Scoreboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0e1526; --panel:#152036;
    --ink:#eef2f8; --ink-soft:#b7c2d4; --muted:#7c8aa2; --hair:#243349;
    --athena:#6C8CD5; --apollo:#E6A817; --artemis:#2FA98C; --hephaestus:#E4572E;
    --display:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);color:var(--ink);background:radial-gradient(1200px 700px at 50% -10%, #1b2942, var(--paper));min-height:100vh;position:relative;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;font-feature-settings:"liga" 1,"kern" 1}
  .wrap{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:44px 26px 60px}
  header{text-align:center;margin-bottom:36px}
  .clock{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);margin-top:14px}
  h1{font-family:var(--display);font-weight:300;font-size:clamp(38px,6.6vw,72px);line-height:1.02;margin:8px 0 6px;color:var(--ink);letter-spacing:.005em}
  h1 em{font-style:italic;font-weight:400}
  .rule{width:54px;height:1px;background:var(--ink);opacity:.35;margin:16px auto 0}
  .tag{font-size:13.5px;color:var(--muted);margin-top:14px;letter-spacing:.02em}
  .live-dot{display:inline-flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .live-dot i{width:7px;height:7px;border-radius:50%;background:#7fa38f;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,163,143,.45)}70%{box-shadow:0 0 0 9px rgba(127,163,143,0)}100%{box-shadow:0 0 0 0 rgba(127,163,143,0)}}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  @media(max-width:900px){ .board{grid-template-columns:repeat(2,1fr);gap:16px} }
  @media(max-width:520px){ .board{grid-template-columns:1fr} }
  .card{position:relative;background:linear-gradient(180deg, color-mix(in srgb, var(--tc) 18%, var(--panel)), var(--panel));
    border:1px solid color-mix(in srgb, var(--tc) 40%, var(--hair));border-radius:16px;padding:28px 20px 22px;text-align:center;overflow:hidden;
    box-shadow:0 16px 44px rgba(0,0,0,.32);transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
  .card.lead{transform:translateY(-8px) scale(1.02);box-shadow:0 26px 66px color-mix(in srgb, var(--tc) 38%, transparent)}
  .emblem{font-size:44px;line-height:1;margin-bottom:4px}
  .idx{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  .tname{font-family:var(--display);font-weight:400;font-size:27px;color:var(--ink);line-height:1.12;margin-top:6px}
  .score{font-family:var(--display);font-weight:300;font-size:clamp(58px,9vw,96px);line-height:.95;color:var(--tc);font-variant-numeric:lining-nums tabular-nums;margin-top:12px;text-shadow:0 6px 28px color-mix(in srgb,var(--tc) 40%,transparent)}
  .score.bump{animation:bump .6s cubic-bezier(.2,1.35,.4,1)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  .plabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:14px}
  .bar span{display:block;height:100%;background:var(--tc);transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .rank{margin-top:14px;height:16px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--tc);font-weight:600}
  .rank .lead-mark{border:1px solid color-mix(in srgb,var(--tc) 55%, transparent);border-radius:999px;padding:3px 10px}

  .feed{margin-top:46px;max-width:820px;margin-left:auto;margin-right:auto}
  .feed h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;text-align:center}
  .feed h2 span{display:block;width:38px;height:1px;background:var(--hair);margin:12px auto 0}
  .rows{display:flex;flex-direction:column}
  .row{display:grid;grid-template-columns:56px minmax(120px,168px) 1fr auto;align-items:center;gap:16px;
    padding:13px 6px;border-bottom:1px solid var(--hair);font-size:14.5px;animation:fade .5s ease}
  .row:last-child{border-bottom:0}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .rpts{font-family:var(--display);font-weight:400;font-size:19px;color:var(--tc);text-align:center;font-variant-numeric:tabular-nums}
  .rteam{font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
  .rteam .dot{width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none}
  .rreason{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rmeta{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
  @media(max-width:600px){ .row{grid-template-columns:46px 1fr auto;gap:10px} .rreason{display:none} }
  .empty{text-align:center;color:var(--muted);padding:22px;font-family:var(--display);font-style:italic;font-size:16px}
  .foot{text-align:center;margin-top:34px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5b6880}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="clock" id="clock">—</div>
      <div class="eyebrow">Alpha Summer · Trojan Horse × Olympics</div>
      <h1>The <em>Odyssey</em> Games</h1>
      <div class="rule"></div>
      <div class="tag">East Hampton · Week 9 · Athena · Apollo · Artemis · Hephaestus</div>
      <div class="live-dot"><i></i> Live · updates every 5 seconds</div>
    </header>

    <div class="board" id="board"></div>

    <div class="feed">
      <h2>Latest Points Awarded<span></span></h2>
      <div class="rows" id="rows"><div class="empty">Awaiting the first points…</div></div>
    </div>

    <div class="foot" id="foot">connecting…</div>
  </div>

<script>
  const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3bWV0ZmZ6c3BvYmphbXd3aGNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMDU1MTcsImV4cCI6MjA5NzY4MTUxN30.ES56s2HLTm1hxvYZL6arlPsGnYlaiLcBvj5buRaWyHs';
  // Reads a public, read-only view (safe columns only, week 9) — no login, no emails exposed.
  const REST='https://qwmetffzspobjamwwhca.supabase.co/rest/v1/odyssey_board?select=tribe,points,reason,created_at&order=created_at.desc';
  const ORDER=['athena','apollo','artemis','hephaestus'];
  const COLOR={ athena:'var(--athena)', apollo:'var(--apollo)', artemis:'var(--artemis)', hephaestus:'var(--hephaestus)' };
  const EMOJI={ athena:'🦉', apollo:'☀️', artemis:'🏹', hephaestus:'🔨' };
  const TEAMS={ athena:{name:'Athena'}, apollo:{name:'Apollo'}, artemis:{name:'Artemis'}, hephaestus:{name:'Hephaestus'} };
  const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const roman=['I','II','III','IV'];
  let last={};

  function clockTick(){ const d=new Date();
    document.getElementById('clock').textContent =
      d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})+'  ·  '+
      d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
  clockTick(); setInterval(clockTick,1000);

  function ordinal(n){ return ['First','Second','Third','Fourth'][n]||(n+1)+'th'; }

  function render(totals, recent){
    const board=document.getElementById('board');
    const max=Math.max(1,...ORDER.map(k=>totals[k]||0));
    const top=Math.max(...ORDER.map(k=>totals[k]||0));
    const leaders=ORDER.filter(k=>(totals[k]||0)===top && top>0);
    const lead=leaders.length===1?leaders[0]:'';
    const ranked=ORDER.slice().sort((a,b)=>(totals[b]||0)-(totals[a]||0));
    const rankOf={}; ranked.forEach((k,i)=>rankOf[k]=i);
    if(!board.children.length){
      board.innerHTML=ORDER.map((k,i)=>{ const T=TEAMS[k]||{name:k}; const c=COLOR[k];
        return `<div class="card" id="p-${k}" style="--tc:${c}">
          <div class="emblem">${EMOJI[k]||''}</div>
          <div class="idx">No. ${roman[i]}</div>
          <div class="tname">${esc(T.name)}</div>
          <div class="score" id="s-${k}">0</div>
          <div class="plabel">points</div>
          <div class="bar"><span id="b-${k}" style="width:0%"></span></div>
          <div class="rank" id="r-${k}"></div>
        </div>`; }).join('');
    }
    ORDER.forEach(k=>{
      const v=totals[k]||0;
      const s=document.getElementById('s-'+k);
      if(last[k]!==undefined && v!==last[k]){ s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
      s.textContent=v; last[k]=v;
      document.getElementById('b-'+k).style.width=Math.round(v/max*100)+'%';
      document.getElementById('p-'+k).classList.toggle('lead', lead===k);
      const r=document.getElementById('r-'+k);
      if(r) r.innerHTML = top>0 ? (rankOf[k]===0 && lead===k ? '<span class="lead-mark">Leading</span>' : ordinal(rankOf[k])+' place') : '';
    });

    const rows=document.getElementById('rows');
    if(recent && recent.length){
      rows.innerHTML=recent.map(r=>{ const T=TEAMS[r.tribe]||{name:r.tribe}; const c=COLOR[r.tribe]||'var(--muted)';
        const t2=r.created_at?new Date(r.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'';
        const p=Number(r.points);
        return `<div class="row" style="--tc:${c}">
          <span class="rpts">${p>0?'+':''}${p}</span>
          <span class="rteam"><span class="dot"></span>${esc(T.name)}</span>
          <span class="rreason">${esc(r.reason||'—')}</span>
          <span class="rmeta">${t2?esc(t2):''}</span>
        </div>`; }).join('');
    } else rows.innerHTML='<div class="empty">Awaiting the first points…</div>';
  }

  async function tick(){
    try{
      const res=await fetch(REST,{headers:{'apikey':ANON,'Authorization':'Bearer '+ANON}});
      const rows=await res.json();
      if(Array.isArray(rows)){
        const totals={}; ORDER.forEach(k=>totals[k]=0);
        rows.forEach(r=>{ if(totals[r.tribe]!=null) totals[r.tribe]+=(+r.points||0); });
        render(totals, rows.slice(0,14));
        document.getElementById('foot').textContent='Live · updates every 5 seconds';
      }
    }catch(e){ document.getElementById('foot').textContent='Reconnecting…'; }
  }
  tick(); setInterval(tick, 5000);
</script>
</body>
</html>
