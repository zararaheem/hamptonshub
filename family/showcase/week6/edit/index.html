<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="format-detection" content="telephone=no" />
<title>Edit — Theatre &amp; Cinema Festival</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#0e2233;--panel:#fff;--line:#e6e0d4;--ink:#1f2d3a;--muted:#5d6b78;--teal:#1f7a73;--teal-bright:#2aa39a;--sand:#f6f1e7;--gold:#e6a935;--shadow:0 8px 30px rgba(20,40,60,.10);--display:'Fraunces',Georgia,serif;--body:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);color:var(--ink);background:var(--sand);line-height:1.5}
  .hero{background:linear-gradient(160deg,#0e2233,#14304a);color:#fff;text-align:center;padding:26px 20px}
  .hero .eyebrow{color:var(--teal-bright);letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:700}
  .hero h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,6vw,34px);margin:6px 0 2px}
  .hero p{color:#c3d0d9;font-size:14px;margin:0}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 16px;margin:14px 0}
  .card h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 4px}
  .card .cs{color:var(--muted);font-size:13px;margin:0 0 10px}
  label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px;color:var(--ink)}
  input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--body);font-size:15px;background:#fffdf9}
  input:focus,textarea:focus{outline:none;border-color:var(--teal-bright)}
  textarea{resize:vertical}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-weight:600;font-size:15px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.big{width:100%;padding:13px;font-size:16px}
  .msg{font-size:14px;margin-top:10px}
  .msg.ok{color:var(--teal)}
  .msg.err{color:#b3402f}
  .gate{max-width:380px;margin:40px auto;text-align:center}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:480px){ .row2{grid-template-columns:1fr} }
  .bar{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(246,241,231,0),var(--sand) 40%);padding:14px 0 6px;margin-top:6px}
  .hint{color:var(--muted);font-size:12.5px}
  .toplink{display:inline-block;margin-top:8px;color:var(--teal);font-size:13px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="hero">
    <div class="eyebrow">Showcase editor</div>
    <h1>Edit the festival page</h1>
    <p>Change titles, the tagline, and each performance's name &amp; blurb.</p>
  </div>
  <div class="wrap">
    <div id="gate" class="gate card">
      <h3>Enter the edit password</h3>
      <p class="cs">Ask a coordinator if you don't have it.</p>
      <input id="pw" type="password" placeholder="Password" autocomplete="off">
      <div style="margin-top:12px"><button class="btn big" id="unlock">Unlock editor</button></div>
      <div class="msg err" id="gate-msg"></div>
      <a class="toplink" href="/showcase/week6/">← Back to the festival page</a>
    </div>
    <div id="editor" hidden></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL='https://qwmetffzspobjamwwhca.supabase.co';
  const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3bWV0ZmZ6c3BvYmphbXd3aGNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMDU1MTcsImV4cCI6MjA5NzY4MTUxN30.ES56s2HLTm1hxvYZL6arlPsGnYlaiLcBvj5buRaWyHs';
  const sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const WEEK=6;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const DEFAULT={
    eyebrow:'Showcase Alpha · East Hampton',
    title:'Theatre & Cinema Festival',
    tagline:'Every story ever told is a journey — the Odyssey did it first, and our puppeteers and filmmakers are doing it today.',
    lead:"Tap a performance to give it a star rating and a comment. It's completely anonymous — a bit of fun to celebrate our storytellers.",
    groups:[
      {id:'puppet',emoji:'🎭',label:'Puppet Show',sub:'LL & L1'},
      {id:'trailers',emoji:'🎬',label:'Young Filmmakers',sub:'L2 & MS · Movie Trailers'}
    ],
    items:[
      {key:'puppet',emoji:'🎭',title:'Puppet Show',sub:'LL & L1',group:'puppet',film:false,desc:''},
      {key:'trailer1',emoji:'🎬',title:'Trailer 1',sub:'Team 1',group:'trailers',film:true,desc:''},
      {key:'trailer2',emoji:'🎬',title:'Trailer 2',sub:'Team 2',group:'trailers',film:true,desc:''},
      {key:'trailer3',emoji:'🎬',title:'Trailer 3',sub:'Team 3',group:'trailers',film:true,desc:''},
      {key:'trailer4',emoji:'🎬',title:'Trailer 4',sub:'Team 4',group:'trailers',film:true,desc:''}
    ]
  };
  let CFG=JSON.parse(JSON.stringify(DEFAULT));
  let PW='';

  async function loadConfig(){
    try{ const { data } = await sb.from('showcase_config').select('data').eq('week',WEEK).maybeSingle();
      if(data && data.data){ CFG=Object.assign(JSON.parse(JSON.stringify(DEFAULT)), data.data);
        if(!Array.isArray(CFG.items)||!CFG.items.length) CFG.items=DEFAULT.items;
        if(!Array.isArray(CFG.groups)||!CFG.groups.length) CFG.groups=DEFAULT.groups; }
    }catch(e){}
  }

  document.getElementById('unlock').addEventListener('click',unlock);
  document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') unlock(); });
  async function unlock(){
    PW=(document.getElementById('pw').value||'').trim();
    const m=document.getElementById('gate-msg');
    if(!PW){ gateErr('Enter the password.'); return; }
    const btn=document.getElementById('unlock'); btn.disabled=true; m.className='msg'; m.textContent='Checking…';
    let ok=false;
    try{ const r=await sb.functions.invoke('showcase-save',{body:{verify:true,password:PW}}); ok=!!(r.data&&r.data.ok&&r.data.valid); }catch(e){ ok=false; }
    btn.disabled=false;
    if(!ok){ gateErr('Wrong password — try again.'); return; }
    await loadConfig();
    document.getElementById('gate').hidden=true;
    document.getElementById('editor').hidden=false;
    renderEditor();
  }
  function gateErr(t){ const m=document.getElementById('gate-msg'); m.className='msg err'; m.textContent=t; }

  function field(label,id,val,ph){ return `<label>${esc(label)}</label><input id="${id}" value="${esc(val||'')}" placeholder="${esc(ph||'')}">`; }
  function area(label,id,val,ph){ return `<label>${esc(label)}</label><textarea id="${id}" rows="2" placeholder="${esc(ph||'')}">${esc(val||'')}</textarea>`; }

  function renderEditor(){
    const g=CFG.groups; const it=CFG.items;
    const groupCards=g.map((gr,i)=>`<div class="card">
      <h3>${esc(gr.emoji||'')} Section: ${esc(gr.label||gr.id)}</h3>
      <div class="row2">${field('Heading','g'+i+'_label',gr.label)}${field('Sub-label','g'+i+'_sub',gr.sub)}</div>
    </div>`).join('');
    const itemCards=it.map((item,i)=>{
      const scenes=Array.isArray(item.scenes)?item.scenes:[];
      const sceneFields=scenes.length? `<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">
        <label style="margin:0 0 4px">Scenes (from the Odyssey)</label>
        ${scenes.map((sc,j)=>`<div class="row2" style="margin-top:6px">${field('Scene '+(j+1)+' title','i'+i+'_sc'+j+'_t',sc.title)}${field('Scene '+(j+1)+' note (optional)','i'+i+'_sc'+j+'_d',sc.desc)}</div>`).join('')}
      </div>` : '';
      return `<div class="card">
        <h3>${esc(item.title||item.key)}</h3>
        <div class="cs">${item.film?'Movie trailer — has a film link':'Puppet show'}</div>
        <div class="row2">${field('Title','i'+i+'_title',item.title)}${field('Sub (team / level)','i'+i+'_sub',item.sub)}</div>
        ${area('Description','i'+i+'_desc',item.desc)}
        ${sceneFields}
      </div>`;
    }).join('');
    document.getElementById('editor').innerHTML=`
      <div class="card">
        <h3>Festival header</h3>
        ${field('Eyebrow (small caps line)','f_eyebrow',CFG.eyebrow)}
        ${field('Title','f_title',CFG.title)}
        ${area('Tagline (italic theme line)','f_tagline',CFG.tagline)}
        ${area('Intro line','f_lead',CFG.lead)}
      </div>
      ${groupCards}
      ${itemCards}
      <div class="card">
        <h3>Movie posters</h3>
        <div class="cs">Shown as a ribbon at the bottom of the festival page — tap a poster there to view it larger. Add a title (and optional student name), then upload the image.</div>
        <div id="posters-editor"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px">
          <button class="btn" id="add-poster" style="background:transparent;color:var(--teal);border:1px solid var(--line)">+ Add one</button>
          <label class="btn" id="bulk-label" style="background:transparent;color:var(--teal);border:1px solid var(--line);cursor:pointer;margin:0">Bulk upload images<input type="file" accept="image/*" multiple id="bulk-posters" style="display:none"></label>
          <span class="msg" id="bulk-msg" style="margin:0;font-size:12.5px"></span>
        </div>
      </div>
      <div class="card">
        <h3>Movie trailers</h3>
        <div class="cs">Paste each team's <b>Frame.io link</b> (or upload an MP4). Parents enter a code (<b>lastname-trailerN</b>) on the festival page to watch — add the students' last names below, one per line. Turn on <b>Published</b> when it's ready.</div>
        <div id="films-editor"><div class="cs">Loading trailers…</div></div>
      </div>
      <div class="bar">
        <button class="btn big" id="save">Save changes</button>
        <div class="msg" id="save-msg"></div>
        <div class="hint" style="margin-top:8px">Uploads save on upload; click <b>Save changes</b> to publish titles &amp; order. <a href="/showcase/week6/" style="color:var(--teal)">View page →</a></div>
      </div>`;
    document.getElementById('save').addEventListener('click',save);
    EPOSTERS=(Array.isArray(CFG.posters)?CFG.posters:[]).map(p=>({title:p.title||'', name:p.name||'', url:p.url||''}));
    renderPostersEditor();
    document.getElementById('add-poster').addEventListener('click',()=>{ EPOSTERS.push({title:'',name:'',url:''}); renderPostersEditor(); });
    document.getElementById('bulk-posters').addEventListener('change', bulkUpload);
    loadFilms();
  }

  const TRAILERS=['trailer1','trailer2','trailer3','trailer4'];
  let EFILMS=[];
  async function loadFilms(){
    const host=document.getElementById('films-editor');
    let films=[];
    try{
      const r=await sb.functions.invoke('showcase-save',{body:{getFilms:true,password:PW,week:WEEK}});
      if(r.data&&r.data.ok&&Array.isArray(r.data.films)) films=r.data.films;
    }catch(e){}
    const byItem={}; films.forEach(f=>{ byItem[f.item]=f; });
    EFILMS=TRAILERS.map(item=>{
      const f=byItem[item]||{};
      const cfgItem=(CFG.items||[]).find(it=>it.key===item)||{};
      return {
        item,
        label:cfgItem.title||item.replace('trailer','Trailer '),
        video_url:f.video_url||'',
        published:!!f.published,
        names:Array.isArray(f.names)?f.names.join('\n'):''
      };
    });
    renderFilmsEditor();
  }
  function renderFilmsEditor(){
    const host=document.getElementById('films-editor'); if(!host) return;
    host.innerHTML=EFILMS.map((f,i)=>`<div class="card" style="margin:8px 0;background:#faf6ee" data-fi="${i}">
      <h3 style="font-size:16px;margin-bottom:6px">${esc(f.label)}</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:2px">
        <label class="btn" style="background:transparent;color:var(--teal);border:1px solid var(--line);cursor:pointer;margin:0;font-size:14px;padding:8px 14px">Upload MP4 from device<input type="file" accept="video/*" data-ffile="${i}" style="display:none"></label>
        <label style="display:flex;align-items:center;gap:6px;margin:0;font-weight:600;font-size:14px;cursor:pointer"><input type="checkbox" data-fpub="${i}" ${f.published?'checked':''} style="width:auto"> Published</label>
        <span class="msg" data-fmsg="${i}" style="margin:0;font-size:12.5px"></span>
      </div>
      ${field('Trailer link (MP4 or Frame.io link)','f'+i+'_url',f.video_url,'Paste a Frame.io link, or upload to fill this in')}
      ${area('Student last names (one per line — sets the watch code lastname-'+f.item+')','f'+i+'_names',f.names,'Smith\nJohnson')}
    </div>`).join('');
    host.querySelectorAll('[data-fi]').forEach(row=>{
      const i=+row.dataset.fi;
      const u=row.querySelector('#f'+i+'_url'); if(u) u.addEventListener('input',()=>{ EFILMS[i].video_url=u.value; });
      const nm=row.querySelector('#f'+i+'_names'); if(nm) nm.addEventListener('input',()=>{ EFILMS[i].names=nm.value; });
      const pb=row.querySelector('[data-fpub]'); if(pb) pb.addEventListener('change',()=>{ EFILMS[i].published=pb.checked; });
      const f=row.querySelector('[data-ffile]'); if(f) f.addEventListener('change',()=>uploadTrailerFile(f.files[0], i));
    });
  }
  async function uploadTrailerFile(file, i){
    if(!file) return;
    const msg=document.querySelector(`[data-fmsg="${i}"]`);
    if(file.size>200*1024*1024){ if(msg){ msg.className='msg err'; msg.textContent='Video is over 200MB — please compress it first.'; } return; }
    if(msg){ msg.className='msg'; msg.textContent='Uploading… (large files take a moment)'; }
    const ext=((file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4');
    const rand=Array.from({length:6},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*36)]).join('');
    const path=`wk${WEEK}/${EFILMS[i].item}-${rand}.${ext}`;
    const up=await sb.storage.from('trailers').upload(path, file, {upsert:true, contentType:file.type||'video/mp4'});
    if(up.error){ if(msg){ msg.className='msg err'; msg.textContent='Upload failed — '+(up.error.message||'try again'); } return; }
    const { data }=sb.storage.from('trailers').getPublicUrl(path);
    EFILMS[i].video_url=data.publicUrl;
    const u=document.querySelector('#f'+i+'_url'); if(u) u.value=data.publicUrl;
    if(msg){ msg.className='msg ok'; msg.textContent='Uploaded ✓ — remember to Save changes.'; }
  }
  async function bulkUpload(e){
    const files=[...(e.target.files||[])]; e.target.value='';
    if(!files.length) return;
    const msg=document.getElementById('bulk-msg');
    let done=0;
    for(const file of files){
      if(msg){ msg.className='msg'; msg.textContent=`Uploading ${done+1} of ${files.length}…`; }
      const i=EPOSTERS.length;
      EPOSTERS.push({title:(file.name.replace(/\.[^.]+$/,'')||'Poster'), name:'', url:''});
      renderPostersEditor();
      await uploadPoster(file, i);
      done++;
    }
    if(msg){ msg.className='msg ok'; msg.textContent=`Added ${done} poster${done===1?'':'s'} — set names, then Save changes.`; }
  }

  let EPOSTERS=[];
  function renderPostersEditor(){
    const host=document.getElementById('posters-editor'); if(!host) return;
    host.innerHTML=EPOSTERS.map((p,i)=>`<div class="card" style="margin:8px 0;background:#faf6ee" data-pi="${i}">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="width:62px;height:93px;border-radius:8px;flex:none;border:1px solid var(--line);background:#e9e2d3 ${p.url?`center/cover no-repeat url('${esc(p.url)}')`:''}"></div>
        <div style="flex:1">
          ${field('Title','p'+i+'_title',p.title)}
          ${field('Student name (shown on hover as F. Last)','p'+i+'_name',p.name)}
          <label style="margin-top:8px">Poster image</label>
          <input type="file" accept="image/*" data-pfile="${i}">
          <div class="msg" data-pmsg="${i}" style="font-size:12.5px"></div>
        </div>
        <button class="btn" data-premove="${i}" style="background:transparent;color:#b3402f;border:1px solid var(--line);padding:6px 10px">Remove</button>
      </div>
    </div>`).join('') || '<div class="cs">No posters yet — add one below.</div>';
    host.querySelectorAll('[data-pi]').forEach(row=>{
      const i=+row.dataset.pi;
      const t=row.querySelector('#p'+i+'_title'); if(t) t.addEventListener('input',()=>{ EPOSTERS[i].title=t.value; });
      const nm=row.querySelector('#p'+i+'_name'); if(nm) nm.addEventListener('input',()=>{ EPOSTERS[i].name=nm.value; });
      const f=row.querySelector('[data-pfile]'); if(f) f.addEventListener('change',()=>uploadPoster(f.files[0], i));
      const rm=row.querySelector('[data-premove]'); if(rm) rm.addEventListener('click',()=>{ EPOSTERS.splice(i,1); renderPostersEditor(); });
    });
  }
  async function uploadPoster(file, i){
    if(!file) return;
    const msg=document.querySelector(`[data-pmsg="${i}"]`);
    if(file.size>12*1024*1024){ if(msg){ msg.className='msg err'; msg.textContent='Image is over 12MB — please use a smaller file.'; } return; }
    if(msg){ msg.className='msg'; msg.textContent='Uploading…'; }
    const ext=((file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg');
    const rand=Array.from({length:6},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*36)]).join('');
    const path=`wk${WEEK}/poster-${i}-${rand}.${ext}`;
    const up=await sb.storage.from('posters').upload(path, file, {upsert:true, contentType:file.type||'image/jpeg'});
    if(up.error){ if(msg){ msg.className='msg err'; msg.textContent='Upload failed — '+(up.error.message||'try again'); } return; }
    const { data }=sb.storage.from('posters').getPublicUrl(path);
    EPOSTERS[i].url=data.publicUrl;
    if(!EPOSTERS[i].title){ EPOSTERS[i].title=(file.name.replace(/\.[^.]+$/,'')||'Poster'); }
    if(msg){ msg.className='msg ok'; msg.textContent='Uploaded ✓ — remember to Save changes.'; }
    renderPostersEditor();
  }

  function collect(){
    const v=id=>{ const el=document.getElementById(id); return el?el.value.trim():''; };
    const out=JSON.parse(JSON.stringify(CFG));
    out.eyebrow=v('f_eyebrow'); out.title=v('f_title'); out.tagline=v('f_tagline'); out.lead=v('f_lead');
    out.groups=out.groups.map((gr,i)=>({...gr, label:v('g'+i+'_label'), sub:v('g'+i+'_sub')}));
    out.items=out.items.map((item,i)=>{
      const o={...item, title:v('i'+i+'_title'), sub:v('i'+i+'_sub'), desc:v('i'+i+'_desc')};
      if(Array.isArray(item.scenes) && item.scenes.length){
        o.scenes=item.scenes.map((sc,j)=>({title:v('i'+i+'_sc'+j+'_t'), desc:v('i'+i+'_sc'+j+'_d')}));
      }
      return o;
    });
    out.posters=EPOSTERS.map((p,i)=>({title:(document.getElementById('p'+i+'_title')||{}).value?.trim()||p.title||'', name:(document.getElementById('p'+i+'_name')||{}).value?.trim()||p.name||'', url:p.url||''})).filter(p=>p.title||p.url||p.name);
    return out;
  }
  function collectFilms(){
    return EFILMS.map(f=>({
      item:f.item,
      video_url:(f.video_url||'').trim(),
      published:!!f.published,
      names:(f.names||'').split('\n').map(s=>s.trim()).filter(Boolean)
    }));
  }
  async function save(){
    const btn=document.getElementById('save'); const msg=document.getElementById('save-msg');
    const data=collect();
    if(!data.title){ msg.className='msg err'; msg.textContent='A festival title is required.'; return; }
    btn.disabled=true; msg.className='msg'; msg.textContent='Saving…';
    let res;
    try{ res=await sb.functions.invoke('showcase-save', { body:{ week:WEEK, password:PW, data, films:collectFilms() } }); }
    catch(e){ res=null; }
    const p=res&&res.data;
    if(p&&p.ok){ CFG=data; msg.className='msg ok'; msg.textContent='Saved ✓ — live on the festival page.'; btn.disabled=false; return; }
    btn.disabled=false;
    if(p&&p.status==='bad_password'){ const npw=prompt('Re-enter the edit password to save (your changes are kept):',''); if(npw){ PW=npw.trim(); return save(); } msg.className='msg err'; msg.textContent='Not saved — password needed.'; }
    else { msg.className='msg err'; msg.textContent='Could not save — please try again.'; }
  }
</script>
</body>
</html>
