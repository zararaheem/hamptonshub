<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="format-detection" content="telephone=no" />
<title>Week 6 Showcase — Live Results</title>
<meta name="description" content="Live audience results for the Week 6 showcase." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b1622; --bg2:#122237; --panel:#16273d; --line:#26405c; --ink:#f3f6fa; --muted:#93a6bb;
    --gold:#ecb63a; --teal:#2aa39a; --brass:#c8924a;
    --display:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);color:var(--ink);background:radial-gradient(1200px 600px at 50% -10%,#173357,#0b1622 60%);min-height:100vh;line-height:1.5}
  header{text-align:center;padding:26px 20px 10px}
  header .eyebrow{color:var(--teal);letter-spacing:.2em;text-transform:uppercase;font-size:13px;font-weight:600}
  header h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,52px);margin:6px 0 2px}
  header .sub{color:var(--muted);font-size:15px}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-top:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:#3ad07a;box-shadow:0 0 0 0 rgba(58,208,122,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,208,122,.6)}70%{box-shadow:0 0 0 10px rgba(58,208,122,0)}100%{box-shadow:0 0 0 0 rgba(58,208,122,0)}}
  .wrap{max-width:1100px;margin:0 auto;padding:16px 18px 60px;display:grid;grid-template-columns:1.15fr .85fr;gap:20px}
  @media(max-width:820px){ .wrap{grid-template-columns:1fr} }
  .col h2{font-family:var(--display);font-weight:600;font-size:19px;color:var(--muted);margin:6px 2px 10px;letter-spacing:.02em}
  .board{display:flex;flex-direction:column;gap:12px}
  .rank{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:transform .4s}
  .rank.top{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 34px rgba(236,182,58,.14);background:linear-gradient(180deg,#1c2c42,#16273d)}
  .pos{font-family:var(--display);font-weight:700;font-size:30px;color:var(--muted);width:44px;text-align:center;flex:none}
  .rank.top .pos{color:var(--gold)}
  .emoji{font-size:34px;flex:none}
  .who{flex:1;min-width:0}
  .who .t{font-family:var(--display);font-weight:600;font-size:22px}
  .who .s{color:var(--muted);font-size:13.5px}
  .badge{display:inline-block;background:rgba(236,182,58,.16);color:var(--gold);border:1px solid rgba(236,182,58,.4);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;letter-spacing:.03em;margin-left:8px;vertical-align:middle}
  .score{text-align:right;flex:none}
  .score .n{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
  .score .stars{font-size:16px;color:var(--gold);letter-spacing:1px}
  .score .stars .off{color:#39516d}
  .score .c{color:var(--muted);font-size:12px;margin-top:2px}
  .feed{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;height:100%;max-height:72vh;overflow:hidden;position:relative}
  .feed-inner{display:flex;flex-direction:column;gap:9px;overflow-y:auto;max-height:70vh;padding:6px}
  .cmt{background:#0f1e30;border:1px solid var(--line);border-radius:12px;padding:10px 13px;animation:fade .5s}
  @keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .cmt .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .cmt .who2{font-size:12.5px;color:var(--teal);font-weight:600}
  .cmt .st{color:var(--gold);font-size:13px;letter-spacing:1px}
  .cmt .tx{font-size:15.5px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
  .cmt .ag{font-size:11px;color:var(--muted);margin-top:3px}
  .empty{color:var(--muted);font-style:italic;padding:16px;text-align:center}
  .totalbar{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13.5px;margin-top:4px}
</style>
</head>
<body>
  <header>
    <div class="eyebrow">Alpha Summer · East Hampton</div>
    <h1>Week 6 Showcase — Live Results</h1>
    <div class="sub">Puppet Show (LL &amp; L1) · Young Filmmakers (L2 &amp; MS) · audience choice</div>
    <div class="live"><span class="dot"></span> Live — updates automatically</div>
  </header>
  <div class="wrap">
    <div class="col">
      <h2>Audience ranking</h2>
      <div class="board" id="board"><div class="empty">Waiting for the first votes…</div></div>
    </div>
    <div class="col">
      <h2>What people are saying</h2>
      <div class="feed"><div class="feed-inner" id="feed"><div class="empty">Comments will appear here as they come in.</div></div></div>
    </div>
    <div class="totalbar" id="totalbar"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL='https://qwmetffzspobjamwwhca.supabase.co';
  const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3bWV0ZmZ6c3BvYmphbXd3aGNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMDU1MTcsImV4cCI6MjA5NzY4MTUxN30.ES56s2HLTm1hxvYZL6arlPsGnYlaiLcBvj5buRaWyHs';
  const sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const WEEK=6;
  const ITEMS={
    puppet:{emoji:'🎭', title:'Puppet Show', sub:'LL & L1'},
    trailer1:{emoji:'🎬', title:'Trailer 1', sub:'Team 1'},
    trailer2:{emoji:'🎬', title:'Trailer 2', sub:'Team 2'},
    trailer3:{emoji:'🎬', title:'Trailer 3', sub:'Team 3'},
    trailer4:{emoji:'🎬', title:'Trailer 4', sub:'Team 4'},
  };
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const starBar=n=>{ const r=Math.round(n); let h=''; for(let i=1;i<=5;i++) h+=`<span class="${i<=r?'':'off'}">${i<=r?'★':'☆'}</span>`; return h; };
  function timeAgo(iso){ const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
    if(s<60) return 'just now'; const m=Math.floor(s/60); if(m<60) return m+'m ago';
    const h=Math.floor(m/60); if(h<24) return h+'h ago'; return Math.floor(h/24)+'d ago'; }

  async function load(){
    const { data, error } = await sb.from('showcase_reviews')
      .select('item,rating,comment,created_at').eq('week',WEEK).order('created_at',{ascending:false});
    if(error) return;
    const agg={}; Object.keys(ITEMS).forEach(k=>agg[k]={sum:0,count:0});
    const comments=[];
    (data||[]).forEach(r=>{ const a=agg[r.item]; if(a){ a.sum+=r.rating; a.count++; }
      if(r.comment && r.comment.trim()) comments.push(r); });
    renderBoard(agg); renderFeed(comments);
    const totalVotes=Object.values(agg).reduce((s,a)=>s+a.count,0);
    document.getElementById('totalbar').textContent = totalVotes
      ? `${totalVotes} rating${totalVotes===1?'':'s'} · ${comments.length} comment${comments.length===1?'':'s'} so far`
      : '';
  }

  function renderBoard(agg){
    const rows=Object.keys(ITEMS).map(k=>({k, ...ITEMS[k], avg: agg[k].count? agg[k].sum/agg[k].count : 0, count: agg[k].count}));
    rows.sort((a,b)=> b.avg-a.avg || b.count-a.count);
    const anyVotes=rows.some(r=>r.count>0);
    const el=document.getElementById('board');
    if(!anyVotes){ el.innerHTML='<div class="empty">Waiting for the first votes…</div>'; return; }
    el.innerHTML=rows.map((r,i)=>{
      const top = i===0 && r.count>0;
      return `<div class="rank ${top?'top':''}">
        <div class="pos">${r.count? (i+1):'–'}</div>
        <div class="emoji">${r.emoji}</div>
        <div class="who"><div class="t">${esc(r.title)}${top?'<span class="badge">🏆 Audience Favorite</span>':''}</div>
          <div class="s">${esc(r.sub)}</div></div>
        <div class="score"><div class="n">${r.count? r.avg.toFixed(1):'—'}</div>
          <div class="stars">${starBar(r.avg)}</div>
          <div class="c">${r.count? r.count+' rating'+(r.count===1?'':'s'):'no ratings'}</div></div>
      </div>`;
    }).join('');
  }

  function renderFeed(comments){
    const el=document.getElementById('feed');
    if(!comments.length){ el.innerHTML='<div class="empty">Comments will appear here as they come in.</div>'; return; }
    el.innerHTML=comments.slice(0,60).map(c=>{ const it=ITEMS[c.item]||{title:c.item};
      return `<div class="cmt"><div class="top"><span class="who2">${esc(it.title)}</span>
        <span class="st">${'★'.repeat(c.rating)}${'☆'.repeat(5-c.rating)}</span></div>
        <div class="tx">${esc(c.comment)}</div><div class="ag">${timeAgo(c.created_at)}</div></div>`;
    }).join('');
  }

  load();
  setInterval(load, 8000);   // refresh for the big screen
</script>
</body>
</html>
